spring.application.name=FlightManagementSystem

#docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#server
server.port= 9000

# spring.jpa.hibernate.ddl-auto: specifies the strategy for creating and dropping database tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/flight_management

# spring.datasource.username: specifies the username for the PostgreSQL database connection
spring.datasource.username=root

# spring.datasource.password: specifies the password for the PostgreSQL database connection
spring.datasource.password=